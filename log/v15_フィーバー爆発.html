<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>赤いボタンを探せ！</title>
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden;font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:#16181d;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:16px 24px;pointer-events:none;font-size:15px;color:#8a909b}
  #hud b{display:block;font-size:34px;font-weight:600;color:#16181d;font-variant-numeric:tabular-nums}
  #hud div:last-child{text-align:right}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.92);text-align:center;gap:12px;padding:20px}
  #overlay.hide{display:none}
  #overlay h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:600}
  #overlay p{margin:0;color:#5b616c;line-height:1.7}
  #big{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums}
  button{font:inherit;font-size:18px;margin-top:8px;padding:11px 40px;border:0;border-radius:8px;color:#fff;background:#16181d;cursor:pointer}
  button:active{transform:scale(.97)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div>スコア<b id="sc">0</b></div><div>残り時間<b id="tm">30.0</b></div></div>
<div id="overlay">
  <h1 id="ttl">赤いボタンを探せ</h1>
  <div id="big" hidden></div>
  <p id="txt">球をドラッグ、または WASD / 矢印キーで回転。<br>30秒の間に赤いボタンをできるだけ多く押そう。<br>正解で 1000点。<b>速く・ノーミス</b>ならさらに加算。ミスは −500点。<br>1万点ごとに <b>FEVER</b> 突入！6秒間 得点2倍・制限時間+3秒。<br>フィーバー中は<b>全ボタンが赤</b>！ 押すほど得点。全部押すと新しい球。<br>フィーバー中にもう一度達成すると、時間延長・倍率アップ。ただし次の条件は厳しくなる。</p>
  <button id="go">スタート</button>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const TIME = 30, N = 280;
const EXPLODE_MS = 450, POPIN_MS = 450;
const FEVER_STEP = 10000, FEVER_MS = 6000, FEVER_MULT = 2;   // 1万点ごとに6秒間フィーバー（得点2倍）
const FEVER_TIME_BONUS = 3000, FEVER_STEP_UP = 2500;          // 突入で制限時間+3秒 / フィーバー中の再突入ごとに間隔+2500点
const FEVER_EXT = 1500, FEVER_EXT_DECAY = 0.7, FEVER_EXT_MIN = 300, FEVER_MULT_UP = 1;   // フィーバー中の再突入: 時間延長(回ごとに減少)・倍率+1
const FEVER_PRESS = 1000;                                     // フィーバー中は全ボタンが赤。1個押すごとの基本点
let W, H, R, RS, cx, cy, dpr;
function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx = W/2; cy = H/2; R = Math.min(W,H)*0.38; RS = R;
}
addEventListener('resize', resize); resize();

// --- 回転 ---
let M = [1,0,0, 0,1,0, 0,0,1];
function mul(a,b){const r=new Array(9);for(let i=0;i<3;i++)for(let j=0;j<3;j++)r[i*3+j]=a[i*3]*b[j]+a[i*3+1]*b[3+j]+a[i*3+2]*b[6+j];return r;}
function rotY(t){const c=Math.cos(t),s=Math.sin(t);return [c,0,s,0,1,0,-s,0,c];}
function rotX(t){const c=Math.cos(t),s=Math.sin(t);return [1,0,0,0,c,-s,0,s,c];}
function spin(dx,dy){ M = mul(rotY(dx), mul(rotX(dy), M)); }
function project(p){
  return {x: cx + (M[0]*p[0]+M[1]*p[1]+M[2]*p[2])*RS,
          y: cy - (M[3]*p[0]+M[4]*p[1]+M[5]*p[2])*RS,
          z: M[6]*p[0]+M[7]*p[1]+M[8]*p[2]};
}

// --- 状態 ---
const pts = [], hues = [];
(function(){ const ga = Math.PI*(3-Math.sqrt(5)), pal = [215,140,48,270,185];
  for(let i=0;i<N;i++){ const y=1-(i+.5)/N*2, r=Math.sqrt(1-y*y), t=ga*i; pts.push([Math.cos(t)*r, y, Math.sin(t)*r]); hues.push('white'); }
})();
const btnR = Math.sqrt(4*Math.PI/N)/2*0.8;   // 球の半径に対するボタン半径
let redIdx = 0, score = 0, found = 0, streak = 0, roundMiss = 0, roundStart = 0;
let phase = 'idle', phaseT = 0, sphereScale = 1;
let endAt = 0, vx = 0, vy = 0, flash = 0, flashCol = '', shake = 0;
let debris = [], popups = [];
let feverUntil = 0, feverStart = 0, nextFever = FEVER_STEP, feverStep = FEVER_STEP;
let feverMult = FEVER_MULT, feverExt = FEVER_EXT, feverSphere = false, pressed = new Array(N).fill(false);
let best = 0; try { best = +localStorage.getItem('redbtn_best2') || 0; } catch(e){}

function newSphere(){
  redIdx = Math.floor(Math.random()*N);
  // 赤は表側・裏側どちらにも出る（ランダム）
  M = [1,0,0,0,1,0,0,0,1];
  spin(Math.random()*6.28, (Math.random()-.5)*3);
  // フィーバー中の球は全ボタンが赤（1個ずつ押して消していく）
  feverSphere = performance.now() < feverUntil;
  pressed.fill(false);
}
function radiusOf(z){ return btnR*RS*Math.sqrt(Math.max(z,0.05)); }
const easeOutBack = t => { const c = 1.70158; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };

// --- 入力 ---
let dragging = false, lx = 0, ly = 0, moved = 0;
cv.addEventListener('pointerdown', e => { dragging = true; cv.setPointerCapture(e.pointerId); lx = e.clientX; ly = e.clientY; moved = 0; vx = vy = 0; });
cv.addEventListener('pointermove', e => {
  if(!dragging) return;
  const dx = e.clientX-lx, dy = e.clientY-ly; lx = e.clientX; ly = e.clientY;
  moved += Math.abs(dx)+Math.abs(dy);
  const k = 1.6/R; spin(dx*k, dy*k); vx = dx*k; vy = dy*k;
});
cv.addEventListener('pointerup', e => { dragging = false; if(moved < 8) clickAt(e.clientX, e.clientY); });

const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys[k] = true; e.preventDefault(); }
  if((k === ' ' || k === 'enter') && !$('overlay').classList.contains('hide')){ e.preventDefault(); start(); }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k] = false; });

function setScore(v){ score = Math.max(0, v); $('sc').textContent = score.toLocaleString(); }

function clickAt(mx,my){
  if(phase !== 'play') return;
  if(feverSphere){ feverPress(mx,my); return; }
  let hit = -1, bd = 1e9;
  for(let i=0;i<N;i++){
    const s = project(pts[i]);
    if(s.z < 0.1) continue;
    const d = Math.hypot(s.x-mx, s.y-my);
    const rr = i === redIdx ? radiusOf(s.z)*1.4+8 : radiusOf(s.z)+3;   // 赤は判定を大きめに
    if(d <= rr && (d < bd || i === redIdx)){ bd = d; hit = i; if(i === redIdx) break; }
  }
  if(hit < 0) return;
  const s = project(pts[hit]);
  if(hit === redIdx){
    const t = (performance.now()-roundStart)/1000;
    const speed = Math.round(1500*Math.max(0, Math.min(1, 1-(t-1)/6))/10)*10;
    const acc = roundMiss === 0 ? 500 : 0;
    const mult = 1 + 0.1*Math.min(streak, 5);
    const fever = performance.now() < feverUntil;
    const gain = Math.round((1000+speed+acc)*mult*(fever ? feverMult : 1)/10)*10;
    setScore(score+gain); found++;
    if(roundMiss === 0) streak++; else streak = 0;
    const lines = [{t:'ベース +1,000', c:'#2fa4e7'}];
    if(speed) lines.push({t:`スピード +${speed.toLocaleString()}`, c:'#2fa4e7'});
    if(acc) lines.push({t:'ノーミス +500', c:'#2fa4e7'});
    if(mult > 1) lines.push({t:`${streak}連続 COMBO ×${mult.toFixed(1)}`, c:'#2fa4e7'});
    if(fever) lines.push({t:`FEVER ×${feverMult}`, c:'#ff7a1a'});
    lines.push({t:'+'+gain.toLocaleString(), c:'#1a9e55', big:true});
    popups.push({x:s.x, y:s.y, lines, t0:performance.now()});
    flash = 1; flashCol = '80,200,120';
    explode(s);
    checkFever();
  } else {
    roundMiss++; streak = 0; shake = 12;
    setScore(score-500);
    popups.push({x:s.x, y:s.y, lines:[{t:'−500', c:'#e5283c', big:true}], t0:performance.now()});
    flash = 1; flashCol = '230,60,60';
  }
}

// --- フィーバー ---
function checkFever(){
  if(score < nextFever) return;
  const nowT = performance.now(), chain = nowT < feverUntil;
  const sub = [`制限時間 +${FEVER_TIME_BONUS/1000}秒`];
  if(chain){
    feverStep += FEVER_STEP_UP;              // 条件が厳しくなる
    feverMult += FEVER_MULT_UP;              // 倍率アップ
    feverUntil += feverExt;                  // 時間延長（回を追うごとに減る）
    sub.unshift(`フィーバー +${(feverExt/1000).toFixed(1)}秒`);
    feverExt = Math.max(FEVER_EXT_MIN, Math.round(feverExt*FEVER_EXT_DECAY/100)*100);
  } else {
    feverMult = FEVER_MULT; feverExt = FEVER_EXT;
    feverStart = nowT; feverUntil = nowT + FEVER_MS;
  }
  do { nextFever += feverStep; } while(nextFever <= score);
  sub.push(`次は ${nextFever.toLocaleString()}点`);
  endAt += FEVER_TIME_BONUS;
  popups.push({x:cx, y:cy-R*.9, t0:nowT+(chain ? 0 : 400), lines:[
    {t:(chain ? 'FEVER連続！ ' : 'FEVER突入！ ')+'得点×'+feverMult, c:'#ff7a1a', big:true},
    {t:sub.join('　'), c:'#ff7a1a'}]});
}
function feverPress(mx,my){
  let hit = -1, bd = 1e9;
  for(let i=0;i<N;i++){
    if(pressed[i]) continue;
    const s = project(pts[i]);
    if(s.z < 0.1) continue;
    const d = Math.hypot(s.x-mx, s.y-my);
    if(d <= radiusOf(s.z)*1.1+4 && d < bd){ bd = d; hit = i; }
  }
  if(hit < 0) return;
  const s = project(pts[hit]);
  pressed[hit] = true;
  const gain = FEVER_PRESS*feverMult;
  setScore(score+gain); found++;
  popups.push({x:s.x, y:s.y, lines:[{t:'+'+gain.toLocaleString(), c:'#ff7a1a', big:true}], t0:performance.now()});
  // 押したボタンが爆発
  const br = radiusOf(s.z);
  debris.push({x:s.x, y:s.y, vx:(s.x-cx)/RS*6, vy:(s.y-cy)/RS*6-3, r:br, col:'red', a:1, kind:'btn'});
  for(let k=0;k<16;k++){
    const a = Math.random()*6.2832, sp = 3 + Math.random()*8;
    debris.push({x:s.x, y:s.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1, r:br*(.15+Math.random()*.3), col:'shard', a:1, kind:'shard', ember:1});
  }
  debris.push({x:s.x, y:s.y, r:br, vx:0, vy:0, a:1, kind:'ring', gr:5});
  shake = Math.max(shake, 5);
  flash = 1; flashCol = '255,150,40';
  if(pressed.every(Boolean)) explode(s);
  checkFever();
}

// --- 爆発 ---
function explode(from){
  for(let i=0;i<N;i++){
    if(pressed[i]) continue;
    const s = project(pts[i]);
    if(s.z <= 0) continue;
    const dx = s.x-cx, dy = s.y-cy, d = Math.hypot(dx,dy) || 1;
    const sp = 5 + Math.random()*9 + (1-d/RS)*4;
    debris.push({x:s.x, y:s.y, vx:dx/d*sp + (Math.random()-.5)*3, vy:dy/d*sp + (Math.random()-.5)*3 - 2,
      r:radiusOf(s.z), col: (feverSphere || i===redIdx) ? 'red' : hues[i], a:1, kind:'btn'});
  }
  for(let i=0;i<90;i++){
    const a = Math.random()*6.2832, sp = 4 + Math.random()*14;
    debris.push({x:cx+Math.cos(a)*RS*Math.random()*.8, y:cy+Math.sin(a)*RS*Math.random()*.8,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 2, r:4+Math.random()*16, col:'shard', a:1, kind:'shard'});
  }
  debris.push({x:cx, y:cy, r:RS*.5, vx:0, vy:0, a:1, kind:'ring'});
  phase = 'explode'; phaseT = performance.now(); shake = 22;
}

// --- 進行 ---
function start(){
  $('overlay').classList.add('hide');
  setScore(0); found = 0; streak = 0; debris = []; popups = [];
  feverUntil = 0; nextFever = feverStep = FEVER_STEP;
  newSphere(); roundMiss = 0;
  phase = 'popin'; phaseT = performance.now();
  endAt = performance.now() + TIME*1000;
}
function finish(){
  phase = 'idle'; sphereScale = 1; RS = R; $('tm').textContent = '0.0'; feverUntil = 0; feverSphere = false; $('sc').style.color = '';
  const isBest = score > best;
  if(isBest){ best = score; try { localStorage.setItem('redbtn_best2', best); } catch(e){} }
  $('ttl').textContent = '終了';
  $('big').hidden = false; $('big').textContent = score.toLocaleString();
  $('txt').innerHTML = `${found}個 発見　ハイスコア ${best.toLocaleString()}${isBest && score > 0 ? '（更新！）' : ''}`;
  $('go').textContent = 'もう一度';
  $('overlay').classList.remove('hide');
}
$('go').onclick = start;

// --- 描画 ---
function drawBuzzer(x, y, r, col, alpha){
  ctx.save(); ctx.globalAlpha = alpha;
  // 台座
  let g = ctx.createLinearGradient(x, y-r, x, y+r);
  g.addColorStop(0, '#5b616c'); g.addColorStop(1, '#23262d');
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fillStyle = g; ctx.fill();
  // 金属のふち
  g = ctx.createLinearGradient(x, y-r, x, y+r);
  g.addColorStop(0, '#e8ebef'); g.addColorStop(1, '#8a909b');
  ctx.beginPath(); ctx.arc(x, y, r*.88, 0, 6.2832); ctx.fillStyle = g; ctx.fill();
  // ドーム本体
  const rd = r*.74;
  g = ctx.createRadialGradient(x-rd*.3, y-rd*.35, rd*.05, x, y, rd);
  if(col === 'red'){ g.addColorStop(0, 'hsl(355,90%,68%)'); g.addColorStop(1, 'hsl(355,85%,38%)'); }
  else { g.addColorStop(0, '#c9cdd4'); g.addColorStop(1, '#8f959f'); }
  ctx.beginPath(); ctx.arc(x, y, rd, 0, 6.2832); ctx.fillStyle = g; ctx.fill();
  // ツヤ
  ctx.beginPath(); ctx.ellipse(x-rd*.28, y-rd*.42, rd*.42, rd*.24, -.5, 0, 6.2832);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
  ctx.restore();
}

function frame(){
  const now = performance.now();
  // フェーズ進行
  if(phase === 'explode' && now-phaseT >= EXPLODE_MS){ newSphere(); phase = 'popin'; phaseT = now; }
  if(phase === 'popin' && now-phaseT >= POPIN_MS){ phase = 'play'; roundStart = now; roundMiss = 0; }
  if(feverSphere && now >= feverUntil && (phase === 'play' || phase === 'popin')){
    if(pressed.some(Boolean)) explode(null); else feverSphere = false;   // フィーバー終了: 残りの球は破棄して通常の球へ
  }
  sphereScale = phase === 'explode' ? 0 : phase === 'popin' ? Math.max(0, easeOutBack((now-phaseT)/POPIN_MS)) : 1;
  RS = R*sphereScale;

  // キー回転 + 慣性
  const ks = 0.035;
  let kx = 0, ky = 0;
  if(keys.a || keys.arrowleft) kx -= ks;
  if(keys.d || keys.arrowright) kx += ks;
  if(keys.w || keys.arrowup) ky -= ks;
  if(keys.s || keys.arrowdown) ky += ks;
  if(kx || ky){ spin(kx, ky); vx = kx; vy = ky; }
  else if(!dragging){ spin(vx, vy); vx *= .94; vy *= .94; }

  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
  const fv = phase !== 'idle' && now < feverUntil;
  const fvLeft = fv ? (feverUntil-now)/FEVER_MS : 0;
  const fvFade = fv ? Math.min(1, (now-feverStart)/300, (feverUntil-now)/400) : 0;
  if(fv){
    const pulse = .5 + .5*Math.sin(now/90);
    const g = ctx.createRadialGradient(cx,cy,R*.4,cx,cy,Math.hypot(W,H)*.6);
    g.addColorStop(0, 'rgba(255,200,120,0)');
    g.addColorStop(1, `rgba(255,${90+pulse*50|0},40,${(.28+.12*pulse)*fvFade})`);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }
  $('sc').style.color = fv ? '#ff7a1a' : '';
  ctx.save();
  if(shake > 0){ ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); shake *= .86; if(shake < .5) shake = 0; }

  if(sphereScale > 0.01){
    // 白い球（影と輪郭で浮かせる）
    ctx.save();
    ctx.shadowColor = 'rgba(30,40,60,.22)'; ctx.shadowBlur = 36; ctx.shadowOffsetY = 14;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx,cy,RS*1.02,0,6.2832); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#d7dbe2'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx,cy,RS*1.02,0,6.2832); ctx.stroke();
    if(fv){
      ctx.save(); ctx.globalAlpha = fvFade;
      ctx.strokeStyle = `hsl(${(now/4)%360},95%,55%)`; ctx.lineWidth = 8;
      ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.arc(cx,cy,RS*1.05+4*Math.sin(now/70),0,6.2832); ctx.stroke();
      ctx.restore();
    }

    const vis = [];
    for(let i=0;i<N;i++){ const s = project(pts[i]); if(s.z > 0.02) vis.push([i,s]); }
    vis.sort((a,b) => a[1].z-b[1].z);
    for(const [i,s] of vis){
      if(pressed[i]) continue;
      const red = phase !== 'idle' && (feverSphere || i === redIdx);
      drawBuzzer(s.x, s.y, radiusOf(s.z), red ? 'red' : hues[i], 1);
    }
  }

  // 破片
  for(const d of debris){
    d.x += d.vx; d.y += d.vy; d.vy += .35; d.vx *= .985;
    if(d.kind === 'ring'){ d.r += d.gr || 24; d.a -= d.gr ? .09 : .06; if(d.a > 0){ ctx.strokeStyle = `rgba(150,160,175,${d.a})`; ctx.lineWidth = 10*d.a; ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,6.2832); ctx.stroke(); } continue; }
    d.a -= .018;
    if(d.a <= 0) continue;
    if(d.kind === 'btn') drawBuzzer(d.x, d.y, d.r, d.col, Math.min(1, d.a*1.4));
    else { ctx.globalAlpha = Math.min(1, d.a*1.5); ctx.fillStyle = d.ember ? '#ff9a3c' : '#dde1e8'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r*d.a, 0, 6.2832); ctx.fill(); ctx.globalAlpha = 1; }
  }
  debris = debris.filter(d => d.a > 0);

  // 結果フラッシュ
  if(flash > 0){
    ctx.strokeStyle = `rgba(${flashCol},${flash})`; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(cx,cy,R*1.02+6,0,6.2832); ctx.stroke();
    flash -= .05;
  }
  // 得点ポップアップ
  ctx.textAlign = 'center';
  const LINE_GAP = 260, POP_LIFE = 2600;
  for(const p of popups){
    const age = now - p.t0;
    if(age > POP_LIFE) continue;
    const fade = Math.min(1, (POP_LIFE-age)/500);
    const px = Math.max(120, Math.min(W-120, p.x));
    const totalH = p.lines.reduce((h,l) => h + (l.big ? 50 : 30), 0);
    let y = Math.max(70, Math.min(H-totalH-30, p.y - totalH/2));
    p.lines.forEach((l, k) => {
      const h = l.big ? 50 : 30;
      const t = age - k*LINE_GAP;
      y += h;
      if(t < 0) return;
      const sc = t < 200 ? Math.max(0.01, easeOutBack(t/200)) : 1;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(px, y-6); ctx.scale(sc, sc);
      ctx.font = `700 ${l.big ? 44 : 22}px "Hiragino Sans","Yu Gothic",sans-serif`;
      ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.strokeText(l.t, 0, 0);
      ctx.fillStyle = l.c; ctx.fillText(l.t, 0, 0);
      ctx.restore();
    });
  }
  popups = popups.filter(p => now - p.t0 <= POP_LIFE);
  ctx.restore();

  // FEVER バナーと残り時間バー
  if(fv){
    const bw = Math.min(W*.6, 420), by = 74;
    ctx.save(); ctx.globalAlpha = fvFade; ctx.textAlign = 'center';
    const sc = 1 + .08*Math.sin(now/80);
    ctx.translate(cx, by); ctx.scale(sc, sc);
    ctx.font = `900 ${Math.min(64, Math.max(40, W*.08))}px "Hiragino Sans","Yu Gothic",sans-serif`;
    ctx.lineJoin = 'round'; ctx.lineWidth = 10; ctx.strokeStyle = '#fff'; ctx.strokeText('FEVER!! ×'+feverMult, 0, 0);
    ctx.fillStyle = `hsl(${20+30*Math.sin(now/100)},100%,52%)`; ctx.fillText('FEVER!! ×'+feverMult, 0, 0);
    ctx.restore();
    ctx.save(); ctx.globalAlpha = fvFade;
    ctx.fillStyle = '#ffe2cc'; ctx.fillRect(cx-bw/2, by+16, bw, 8);
    ctx.fillStyle = '#ff7a1a'; ctx.fillRect(cx-bw/2, by+16, bw*fvLeft, 8);
    ctx.restore();
    // 火の粉
    if(Math.random() < .8) debris.push({x:Math.random()*W, y:H+10, vx:(Math.random()-.5)*2, vy:-12-Math.random()*8, r:3+Math.random()*7, col:'shard', a:1, kind:'shard', ember:1});
  }

  if(phase !== 'idle'){
    const left = Math.max(0, (endAt-now)/1000);
    $('tm').textContent = left.toFixed(1);
    if(left <= 0) finish();
  }
  requestAnimationFrame(frame);
}
newSphere(); spin(0.6, 0.4); vx = .008; vy = .002;
requestAnimationFrame(frame);
</script>
